[project]
name = "document-assistant"
version = "0.1.0"
description = "Local document assistant prototype; implementation pending"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
pdf-eval = [
    "pypdf==7.0.1",
    "pdfplumber==0.11.10",
    "pdfminer-six==20260107",
    "pillow==13.0.0",
    "pypdfium2==5.15.2",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "cffi==2.1.1",
    "pycparser==3.12",
]

tabular-eval = [
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "defusedxml==0.7.1",
]

[tool.uv]
package = false
cache-dir = ".venv/.cache/uv"
python-downloads = "never"
link-mode = "copy"
