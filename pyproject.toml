[project]
name = "document-assistant"
version = "0.1.0"
description = "Local document assistant prototype; implementation pending"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
package = false
cache-dir = ".venv/.cache/uv"
python-downloads = "never"
link-mode = "copy"
