[project]
name = "document-assistant"
version = "0.1.0"
description = "Local document assistant prototype; implementation pending"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
pdf-eval = [
    "pypdf==7.0.1",
    "pdfplumber==0.11.10",
    "pdfminer-six==20260107",
    "pillow==13.0.0",
    "pypdfium2==5.15.2",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "cffi==2.1.1",
    "pycparser==3.12",
]

tabular-eval = [
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
    "defusedxml==0.7.1",
]


ocr-eval = [
    "tesserocr==2.13.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "rapidocr==3.10.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "onnxruntime==1.31.1; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "pyclipper==1.4.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "opencv-python-headless==5.0.0.93; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "numpy==2.5.4; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "six==1.17.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "shapely==2.2.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "pyyaml==6.0.3; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "tqdm==4.70.1; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "omegaconf==2.4.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "requests==2.34.2; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "colorlog==6.12.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "flatbuffers==25.12.19; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "protobuf==7.36.2; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
    "urllib3==2.8.0; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
]

[tool.uv]
package = false
cache-dir = ".venv/.cache/uv"
python-downloads = "never"
link-mode = "copy"

constraint-dependencies = ["annotated-doc==0.0.6", "annotated-types==0.8.0", "anyio==4.16.0", "certifi==2026.10.23", "cffi==2.1.1", "charset-normalizer==3.5.2", "click==8.5.1", "colorama==0.4.6", "cryptography==50.0.2", "defusedxml==0.7.1", "et-xmlfile==2.0.0", "fastapi==0.162.2", "h11==0.16.0", "httpcore==1.0.9", "httpx==0.28.1", "idna==3.20", "iniconfig==2.3.1", "openpyxl==3.1.5", "opentelemetry-api==1.45.2", "packaging==26.3", "pdfminer-six==20260107", "pdfplumber==0.11.10", "pillow==13.0.0", "pluggy==1.7.0", "pycparser==3.12", "pydantic==2.14.3", "pydantic-core==2.50.4", "pygments==2.21.0", "pypdf==7.0.1", "pypdfium2==5.15.2", "pytest==9.2.0", "ruff==0.17.5", "starlette==1.10.0", "typing-extensions==4.16.0", "typing-inspection==0.4.5", "uvicorn==0.54.0"]
